name: Build the frontend assets
description: Installs Rust wasm target and Dioxus CLI, then builds the frontend WASM app

runs:
  using: composite
  steps:
    - name: Install wasm32 target
      run: rustup target add wasm32-unknown-unknown
      shell: sh

    - name: Install Dioxus CLI
      run: cargo install --locked dioxus-cli@0.7.3
      shell: sh

    - name: Build the frontend
      run: dx build -p pasion-frontend --release
      shell: sh

    - name: Copy dist output
      run: rm -rf dist && cp -r target/dx/pasion-frontend/release/web/public dist
      shell: sh

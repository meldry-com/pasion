name: Build the frontend assets
description: Installs Node.js and builds the frontend assets from the frontend directory

runs:
  using: composite
  steps:
    - name: Install Node
      uses: actions/setup-node@v6.0.0
      with:
        node-version: "24"

    - name: Install dependencies
      run: npm ci
      working-directory: ./frontend
      shell: sh

    - name: Build the frontend assets
      run: npm run build
      working-directory: ./frontend
      shell: sh

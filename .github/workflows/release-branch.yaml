name: Create a new release branch
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Release kind (major = v1.2.3 -> v2.0.0-rc.0, minor = v1.2.3 -> v1.3.0-rc.0)"
        required: true
        type: choice
        default: minor
        options:
          - major
          - minor

jobs:
  compute-version:
    name: Compute the next ${{ inputs.kind }} RC version
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    outputs:
      full: ${{ steps.next.outputs.full }}
      short: ${{ steps.next.outputs.short }}

    steps:
      - name: Verify main branch
        if: ${{ github.ref_name != 'main' }}
        run: |
          echo "::error::This workflow must run on the main branch"
          exit 1

      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compute next RC version
        id: next
        env:
          KIND: ${{ inputs.kind }}
        run: |
          current=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "pasion") | .version')
          next=$(npx --yes semver@7.5.4 -i "pre${KIND}" --preid rc "$current")
          short=$(echo "$next" | cut -d. -f1-2)
          echo "full=${next}" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"

  tag:
    uses: ./.github/workflows/tag.yaml
    needs: [compute-version]
    with:
      version: ${{ needs.compute-version.outputs.full }}

  merge-back:
    needs: [tag]
    uses: ./.github/workflows/merge-back.yaml
    with:
      sha: ${{ needs.tag.outputs.sha }}

  branch:
    name: Create the release branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs: [tag, compute-version]

    steps:
      - name: Checkout at tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.tag.outputs.sha }}

      - name: Create and push release branch
        env:
          BRANCH: release/v${{ needs.compute-version.outputs.short }}
        run: |
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"

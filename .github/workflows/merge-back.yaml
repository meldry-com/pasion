name: Merge back to main
on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string

jobs:
  merge-back:
    name: Create merge-back pull request
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Create merge-back branch and PR
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          branch="merge-back/${SOURCE_BRANCH}/${SHA:0:8}"
          git checkout -b "$branch"
          git push origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: merge back ${SOURCE_BRANCH}" \
            --body "Automated merge-back of \`${SOURCE_BRANCH}\` (${SHA:0:8}) into \`main\`."

name: Tag a new version
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    outputs:
      sha:
        description: "The SHA of the version bump commit"
        value: ${{ jobs.tag.outputs.sha }}

jobs:
  tag:
    name: Tag version ${{ inputs.version }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    outputs:
      sha: ${{ steps.push.outputs.sha }}

    steps:
      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Update workspace version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Update the workspace package version
          sed -i "s/^package.version = .*/package.version = \"$VERSION\"/" Cargo.toml
          # Update all internal crate dependency versions
          sed -i "/path = \".\/crates\//s/version = \".*\"/version = \"=$VERSION\"/" Cargo.toml

      - name: Regenerate lockfile
        run: cargo metadata --format-version 1 > /dev/null

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and tag
        id: push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to ${VERSION}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin HEAD --follow-tags
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

name: Push Translations to Localazy

on:
  push:
    branches:
      - main
      - release/v**

jobs:
  push-translations:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@v6

      - name: Prepare Node environment
        uses: actions/setup-node@v6.1.0
        with:
          node-version: 24

      - name: Set up Localazy CLI
        run: npm install -g @localazy/cli

      - name: Derive Localazy branch identifier
        id: localazy-branch
        run: |
          # Strip the "release/" prefix when present; keep 'main' unchanged
          echo "name=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"

      - name: Push source strings to Localazy
        run: localazy upload -w "$LOCALAZY_WRITE_KEY" -b "$BRANCH"
        env:
          BRANCH: ${{ steps.localazy-branch.outputs.name }}
          LOCALAZY_WRITE_KEY: ${{ secrets.LOCALAZY_WRITE_KEY }}

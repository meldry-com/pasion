name: Bump version on release branch
on:
  workflow_dispatch:
    inputs:
      rc:
        description: "Create a release candidate?"
        type: boolean
        default: false
      merge-back:
        description: "Merge the release branch back to main?"
        type: boolean
        default: true

jobs:
  compute-version:
    name: Compute the next version
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    outputs:
      version: ${{ steps.next.outputs.version }}

    steps:
      - name: Verify release branch
        if: ${{ !startsWith(github.ref_name, 'release/v') }}
        run: |
          echo "::error::This workflow must run on a release/* branch"
          exit 1

      - name: Checkout the code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine current version
        id: current
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "pasion") | .version')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: next
        env:
          IS_RC: ${{ inputs.rc }}
          CURRENT: ${{ steps.current.outputs.version }}
        run: |
          if [ "$IS_RC" = "true" ]; then
            BUMP="prerelease"
          else
            BUMP="patch"
          fi
          version=$(npx --yes semver@7.5.4 -i "$BUMP" --preid rc "$CURRENT")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  tag:
    uses: ./.github/workflows/tag.yaml
    needs: [compute-version]
    with:
      version: ${{ needs.compute-version.outputs.version }}

  merge-back:
    if: inputs.merge-back
    needs: [tag]
    uses: ./.github/workflows/merge-back.yaml
    with:
      sha: ${{ needs.tag.outputs.sha }}

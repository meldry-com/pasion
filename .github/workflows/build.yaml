name: Build and Release Pipeline

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"

  # Trigger on pull request label changes; only runs when 'Z-Build-Workflow' label is present
  pull_request:
    types: [labeled]

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"
  IMAGE: ghcr.io/palpo-im/pasion
  BUILDCACHE: ghcr.io/palpo-im/pasion/buildcache
  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -- Version computation --

  compute-version:
    name: Derive version from git tags
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.label.name == 'Z-Build-Workflow'

    permissions:
      contents: read

    outputs:
      describe: ${{ steps.version-info.outputs.describe }}
      timestamp: ${{ steps.version-info.outputs.timestamp }}

    steps:
      - name: Fetch repository with full history
        uses: actions/checkout@v6
        with:
          # Full clone required for accurate git describe output
          fetch-depth: 0

      - name: Extract version and commit timestamp
        id: version-info
        run: |
          echo "describe=$(git describe --tags --match 'v*.*.*' --always)" >> $GITHUB_OUTPUT
          echo "timestamp=$(git log -1 --format=%ct)" >> $GITHUB_OUTPUT

  # -- Asset preparation --

  build-assets:
    name: Prepare distributable assets
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.label.name == 'Z-Build-Workflow'

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@v6

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/build-frontend

      - name: Assemble asset directory
        run: |
          mkdir -p assets-dist/share
          cp dist/manifest.json assets-dist/share/manifest.json
          cp -r dist/ assets-dist/share/assets
          cp -r templates/ assets-dist/share/templates
          cp -r translations/ assets-dist/share/translations
          cp -r policies/cedar/ assets-dist/share/cedar
          cp LICENSE assets-dist/LICENSE
          chmod -R u=rwX,go=rX assets-dist/

      - name: Store asset artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: assets
          path: assets-dist

  # -- Binary compilation --

  build-binaries:
    name: Compile release binaries
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.label.name == 'Z-Build-Workflow'
    needs:
      - compute-version

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu

    env:
      VERGEN_GIT_DESCRIBE: ${{ needs.compute-version.outputs.describe }}
      SOURCE_DATE_EPOCH: ${{ needs.compute-version.outputs.timestamp }}

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@v6

      - name: Set up Rust with target ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            ${{ matrix.target }}

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Set up zig toolchain
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Set up cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Compile pasion binary
        run: |
          cargo zigbuild \
            --release \
            --target ${{ matrix.target }}.2.17 \
            --no-default-features \
            --features dist \
            -p pasion

      - name: Store compiled binary
        uses: actions/upload-artifact@v6.0.0
        with:
          name: binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/pasion

  # -- Archive assembly --

  assemble-archives:
    name: Package release archives
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.label.name == 'Z-Build-Workflow'
    needs:
      - build-binaries
      - build-assets

    permissions:
      contents: read

    steps:
      - name: Retrieve asset artifact
        uses: actions/download-artifact@v7
        with:
          name: assets
          path: assets-dist

      - name: Retrieve x86_64 binary
        uses: actions/download-artifact@v7
        with:
          name: binary-x86_64-unknown-linux-gnu
          path: binary-x86_64

      - name: Retrieve aarch64 binary
        uses: actions/download-artifact@v7
        with:
          name: binary-aarch64-unknown-linux-gnu
          path: binary-aarch64

      - name: Build tarballs for each architecture
        run: |
          for arch in x86_64 aarch64; do
            mkdir -p dist/${arch}/share
            cp -r assets-dist/share/* dist/${arch}/share/
            cp assets-dist/LICENSE dist/${arch}/LICENSE
            cp binary-$arch/pasion dist/${arch}/pasion
            chmod -R u=rwX,go=rX dist/${arch}/
            chmod u=rwx,go=rx dist/${arch}/pasion
            tar -czvf pasion-${arch}-linux.tar.gz --owner=0 --group=0 -C dist/${arch}/ .
          done

      - name: Store aarch64 archive
        uses: actions/upload-artifact@v6.0.0
        with:
          name: pasion-aarch64-linux
          path: pasion-aarch64-linux.tar.gz

      - name: Store x86_64 archive
        uses: actions/upload-artifact@v6.0.0
        with:
          name: pasion-x86_64-linux
          path: pasion-x86_64-linux.tar.gz

  # -- Container image --

  build-image:
    name: Build and publish container image
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.event.label.name == 'Z-Build-Workflow'
    needs:
      - compute-version

    outputs:
      metadata: ${{ steps.extract-metadata.outputs.metadata }}

    permissions:
      contents: read
      id-token: write
      packages: write

    env:
      VERGEN_GIT_DESCRIBE: ${{ needs.compute-version.outputs.describe }}
      SOURCE_DATE_EPOCH: ${{ needs.compute-version.outputs.timestamp }}

    steps:
      - name: Compute Docker tags (standard)
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: "${{ env.IMAGE }}"
          bake-target: docker-metadata-action
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Compute Docker tags (debug variant)
        id: meta-debug
        uses: docker/metadata-action@v5.10.0
        with:
          images: "${{ env.IMAGE }}"
          bake-target: docker-metadata-action-debug
          flavor: |
            latest=auto
            suffix=-debug,onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Set up Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Execute Docker Bake build
        id: bake
        uses: docker/bake-action@v6.10.0
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
            cwd://${{ steps.meta-debug.outputs.bake-file }}
          set: |
            base.output=type=image,push=true
            base.cache-from=type=registry,ref=${{ env.BUILDCACHE }}:buildcache
            base.cache-to=type=registry,ref=${{ env.BUILDCACHE }}:buildcache,mode=max

      - name: Normalize bake output to digest/tag map
        # Produces an object like: { regular: { digest: "...", tags: [...] }, debug: { digest: "...", tags: [...] }, ... }
        id: extract-metadata
        run: |
          echo 'metadata<<EOF' >> $GITHUB_OUTPUT
          echo '${{ steps.bake.outputs.metadata }}' | jq -c 'with_entries(select(.value | (type == "object" and has("containerimage.digest")))) | map_values({ digest: .["containerimage.digest"], tags: (.["image.name"] | split(",")) })' >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Cosign the published images
        # Signing restricted to tag pushes and commits on main
        if: |
          github.event_name != 'pull_request'
          && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')

        env:
          REGULAR_DIGEST: ${{ steps.extract-metadata.outputs.metadata && fromJSON(steps.extract-metadata.outputs.metadata).regular.digest }}
          DEBUG_DIGEST: ${{ steps.extract-metadata.outputs.metadata && fromJSON(steps.extract-metadata.outputs.metadata).debug.digest }}

        run: |-
          cosign sign --yes \
            "$IMAGE@$REGULAR_DIGEST" \
            "$IMAGE@$DEBUG_DIGEST" \

  # -- Tagged release --

  release:
    name: Publish tagged release
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - assemble-archives
      - build-image

    steps:
      - name: Retrieve release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: pasion-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2.5.0
        with:
          draft: true
          generate_release_notes: true
          body: |
            ### Docker image

            Regular image:

              - Digest:
                ```
                ${{ env.IMAGE }}@${{ fromJSON(needs.build-image.outputs.metadata).regular.digest }}
                ```
              - Tags:
                ```
                ${{ join(fromJSON(needs.build-image.outputs.metadata).regular.tags, '
                ') }}
                ```

            Debug variant:

              - Digest:
                ```
                ${{ env.IMAGE }}@${{ fromJSON(needs.build-image.outputs.metadata).debug.digest }}
                ```
              - Tags:
                ```
                ${{ join(fromJSON(needs.build-image.outputs.metadata).debug.tags, '
                ') }}
                ```

          files: |
            artifacts/pasion-aarch64-linux.tar.gz
            artifacts/pasion-x86_64-linux.tar.gz

  # -- Unstable rolling release --

  unstable:
    name: Refresh unstable rolling release
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    needs:
      - assemble-archives
      - build-image

    permissions:
      contents: write

    steps:
      - name: Fetch repository (sparse)
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts

      - name: Retrieve release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: pasion-*
          path: artifacts
          merge-multiple: true

      - name: Advance unstable tag to current commit
        uses: actions/github-script@v8.0.0
        with:
          script: |
            const script = require('./.github/scripts/update-unstable-tag.cjs');
            await script({ core, github, context });

      - name: Publish unstable release
        uses: softprops/action-gh-release@v2.5.0
        with:
          name: "Unstable build"
          tag_name: unstable
          prerelease: true
          make_latest: false
          body: |
            This is an automatically updated unstable release containing the latest builds from the main branch.

            **⚠️ Warning: These are development builds and may be unstable.**

            Last updated: ${{ github.event.head_commit.timestamp }}
            Commit: ${{ github.sha }}

            ### Docker image

            Regular image:

              - Digest:
                ```
                ${{ env.IMAGE }}@${{ fromJSON(needs.build-image.outputs.metadata).regular.digest }}
                ```
              - Tags:
                ```
                ${{ join(fromJSON(needs.build-image.outputs.metadata).regular.tags, '
                ') }}
                ```

            Debug variant:

              - Digest:
                ```
                ${{ env.IMAGE }}@${{ fromJSON(needs.build-image.outputs.metadata).debug.digest }}
                ```
              - Tags:
                ```
                ${{ join(fromJSON(needs.build-image.outputs.metadata).debug.tags, '
                ') }}
                ```

          files: |
            artifacts/pasion-aarch64-linux.tar.gz
            artifacts/pasion-x86_64-linux.tar.gz

  # -- PR label cleanup --

  pr-cleanup:
    name: Clean up build workflow label on PR
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' && github.event.label.name == 'Z-Build-Workflow'
    needs:
      - build-image

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Fetch repository (sparse)
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts

      - name: Strip label and post comment
        uses: actions/github-script@v8.0.0
        env:
          BUILD_IMAGE_MANIFEST: ${{ needs.build-image.outputs.metadata }}
        with:
          script: |
            const script = require('./.github/scripts/cleanup-pr.cjs');
            await script({ core, github, context });

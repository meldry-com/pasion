# Configuration for `cargo audit` (RustSec).
#
# New findings require explicit review. cargo-audit scans the full lockfile,
# including optional packages that cargo-deny excludes from the build graph.

[advisories]
# cedar-policy-core uses chrono for datetime expressions in existing Cedar policies.
# zxcvbn also requires chrono on wasm32 for password-strength scoring.
ignore = [
    "RUSTSEC-2026-0543",
    # lettre's sendmail-transport references async-std?/unstable. Neither
    # async-std nor its pin-utils dependency is enabled by our Tokio transport.
    # deny.toml bans both from the build. Remove once absent from Cargo.lock.
    "RUSTSEC-2025-0052", # async-std
    "RUSTSEC-2026-0441", # pin-utils
]
informational_warnings = ["unmaintained", "unsound"]

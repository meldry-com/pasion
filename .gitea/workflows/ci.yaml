name: Gitea Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: gitea-ci-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  rustfmt:
    name: Verify Rust formatting
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@v4

      - name: Set up nightly Rust for rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Verify formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Lint with Clippy
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@v4

      - name: Set up Rust with Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Execute Clippy lints
        run: cargo clippy --workspace --tests --bins --lib -- -D warnings

  cargo-deny:
    name: Audit dependencies with cargo-deny
    runs-on: ubuntu-24.04

    env:
      RUSTC_WRAPPER: ""

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@v4

      - name: Audit with cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2.0.14
        with:
          rust-version: stable

  check-schema:
    name: Validate generated schemas
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Fetch repository
        uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Regenerate schemas
        run: sh ./misc/update.sh

      - name: Ensure working tree is clean
        run: |
          if ! [[ -z $(git status -s) ]]; then
            echo "::error title=Workspace is not clean::Please run 'sh ./misc/update.sh' (or 'pwsh -File ./misc/update.ps1' on Windows) and commit the changes"
            git diff
            exit 1
          fi

  test:
    name: Run partitioned Rust tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]

    permissions:
      contents: read

    services:
      postgres:
        image: docker.io/library/postgres:15.3
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Fetch repository
        uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Set up nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Execute test partition
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost/postgres
        run: |
          cargo nextest run \
            --workspace \
            --partition count:${{ matrix.partition }}/3

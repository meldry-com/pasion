name: Gitea Build Pipeline

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_TERM_COLOR: always

concurrency:
  group: gitea-build-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  compute-version:
    name: Derive version from git tags
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    outputs:
      describe: ${{ steps.version-info.outputs.describe }}
      timestamp: ${{ steps.version-info.outputs.timestamp }}

    steps:
      - name: Fetch repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version and commit timestamp
        id: version-info
        run: |
          echo "describe=$(git describe --tags --match 'v*.*.*' --always)" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

  build-archives:
    name: Build release archives
    runs-on: ubuntu-24.04
    needs:
      - compute-version

    permissions:
      contents: read

    env:
      VERGEN_GIT_DESCRIBE: ${{ needs.compute-version.outputs.describe }}
      SOURCE_DATE_EPOCH: ${{ needs.compute-version.outputs.timestamp }}

    steps:
      - name: Fetch repository
        uses: actions/checkout@v4

      - name: Set up Rust with Linux targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu

      - name: Set up zig toolchain
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Set up cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Assemble asset directory
        run: |
          mkdir -p assets-dist/share
          cp -r templates/ assets-dist/share/templates
          cp -r translations/ assets-dist/share/translations
          cp -r policies/cedar/ assets-dist/share/cedar
          chmod -R u=rwX,go=rX assets-dist/

      - name: Compile release binaries
        run: |
          cargo zigbuild \
            --release \
            --target x86_64-unknown-linux-gnu.2.17 \
            --no-default-features \
            --features dist \
            -p pasion

          cargo zigbuild \
            --release \
            --target aarch64-unknown-linux-gnu.2.17 \
            --no-default-features \
            --features dist \
            -p pasion

      - name: Build tarballs for each architecture
        run: |
          for arch in x86_64 aarch64; do
            mkdir -p "dist/${arch}/share"
            cp -r assets-dist/share/* "dist/${arch}/share/"
            cp "target/${arch}-unknown-linux-gnu/release/pasion" "dist/${arch}/pasion"
            chmod -R u=rwX,go=rX "dist/${arch}/"
            chmod u=rwx,go=rx "dist/${arch}/pasion"
            tar -czvf "pasion-${arch}-linux.tar.gz" --owner=0 --group=0 -C "dist/${arch}/" .
          done

      - name: Upload release archives
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: pasion-linux-archives
          path: |
            pasion-aarch64-linux.tar.gz
            pasion-x86_64-linux.tar.gz

  prepare-image-build:
    name: Resolve image names and tags
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    outputs:
      images: ${{ steps.image.outputs.images }}
      push: ${{ steps.image.outputs.push_images }}
      use_gitea_registry: ${{ steps.image.outputs.use_gitea_registry }}
      gitea_registry: ${{ steps.image.outputs.gitea_registry }}
      gitea_registry_user: ${{ steps.image.outputs.gitea_registry_user }}
      use_dockerhub: ${{ steps.image.outputs.use_dockerhub }}
      regular_suffixes: ${{ steps.tags.outputs.regular_suffixes }}
      source_suffix: ${{ steps.tags.outputs.source_suffix }}

    steps:
      - name: Resolve image names
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ gitea.repository }}
          SERVER_URL: ${{ gitea.server_url }}
          EVENT_NAME: ${{ gitea.event_name }}
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          set -euo pipefail

          repo_name="${REPOSITORY#*/}"
          registry_host="${SERVER_URL#http://}"
          registry_host="${registry_host#https://}"
          registry_host="${registry_host%%/*}"
          gitea_image="$registry_host/$REPOSITORY"
          use_gitea_registry="false"
          use_dockerhub="false"

          images=()

          if [ -n "${REGISTRY_USER:-}" ] && [ -n "${REGISTRY_TOKEN:-}" ]; then
            use_gitea_registry="true"
            images+=("$gitea_image")
          fi

          if [ -n "${DOCKERHUB_USER:-}" ]; then
            dockerhub_namespace="${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USER}"
            dockerhub_image="$dockerhub_namespace/$repo_name"
            use_dockerhub="true"
            images+=("$dockerhub_image")
          else
            dockerhub_image=""
          fi

          if [ "${#images[@]}" -eq 0 ]; then
            images=("local/$repo_name")
            push_images="false"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            push_images="false"
          else
            push_images="true"
          fi

          {
            echo "gitea_registry=$registry_host"
            echo "gitea_registry_user=${REGISTRY_USER:-}"
            echo "gitea_image=$gitea_image"
            echo "use_gitea_registry=$use_gitea_registry"
            echo "use_dockerhub=$use_dockerhub"
            echo "dockerhub_image=$dockerhub_image"
            echo "push_images=$push_images"
            echo "images<<EOF"
            printf "%s\n" "${images[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute Docker tag suffixes
        id: tags
        shell: bash
        env:
          GITEA_SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail

          ref_name="${{ gitea.ref_name }}"
          ref_type="${{ gitea.ref_type }}"
          short_sha="${GITEA_SHA:0:12}"
          safe_ref="${ref_name//\//-}"

          regular_suffixes=("sha-${short_sha}")

          if [ "$ref_type" = "branch" ]; then
            regular_suffixes+=("$safe_ref")

            if [ "$safe_ref" = "main" ]; then
              regular_suffixes+=("latest")
            fi
          fi

          if [ "$ref_type" = "tag" ] && [[ "$ref_name" == v* ]]; then
            version="${ref_name#v}"
            regular_suffixes+=("$version")

            if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              regular_suffixes+=("${major}.${minor}" "${major}" "latest")
            fi
          fi

          {
            echo "regular_suffixes<<EOF"
            printf "%s\n" "${regular_suffixes[@]}" | awk '!seen[$0]++'
            echo "EOF"
            echo "source_suffix=sha-${short_sha}"
          } >> "$GITHUB_OUTPUT"

  build-image-arch:
    name: Build Docker images (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs:
      - compute-version
      - prepare-image-build

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm64

    permissions:
      contents: read

    env:
      VERGEN_GIT_DESCRIBE: ${{ needs.compute-version.outputs.describe }}
      SOURCE_DATE_EPOCH: ${{ needs.compute-version.outputs.timestamp }}

    steps:
      - name: Fetch repository
        uses: actions/checkout@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea registry
        if: needs.prepare-image-build.outputs.push == 'true' && needs.prepare-image-build.outputs.use_gitea_registry == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare-image-build.outputs.gitea_registry }}
          username: ${{ needs.prepare-image-build.outputs.gitea_registry_user }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.prepare-image-build.outputs.push == 'true' && needs.prepare-image-build.outputs.use_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute per-architecture staging tags
        id: arch-tags
        shell: bash
        env:
          IMAGES: ${{ needs.prepare-image-build.outputs.images }}
          FINAL_SUFFIXES: ${{ needs.prepare-image-build.outputs.regular_suffixes }}
        run: |
          set -euo pipefail

          release_tags=()

          while IFS= read -r image; do
            [ -n "$image" ] || continue
            while IFS= read -r suffix; do
              [ -n "$suffix" ] || continue
              release_tags+=("${image}:${suffix}-${{ matrix.arch }}")
            done <<< "$FINAL_SUFFIXES"
          done <<< "$IMAGES"

          {
            echo "release<<EOF"
            printf "%s\n" "${release_tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build release image for ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          pull: true
          push: ${{ needs.prepare-image-build.outputs.push == 'true' }}
          provenance: false
          sbom: false
          build-args: |
            VERGEN_GIT_DESCRIBE=${{ needs.compute-version.outputs.describe }}
          tags: ${{ steps.arch-tags.outputs.release }}

  publish-image-manifests:
    name: Publish Docker image manifests
    runs-on: ubuntu-24.04
    needs:
      - prepare-image-build
      - build-image-arch
    if: needs.prepare-image-build.outputs.push == 'true'

    permissions:
      contents: read

    steps:
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Gitea registry
        if: needs.prepare-image-build.outputs.use_gitea_registry == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ needs.prepare-image-build.outputs.gitea_registry }}
          username: ${{ needs.prepare-image-build.outputs.gitea_registry_user }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.prepare-image-build.outputs.use_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish release multi-arch manifests
        shell: bash
        env:
          IMAGES: ${{ needs.prepare-image-build.outputs.images }}
          FINAL_SUFFIXES: ${{ needs.prepare-image-build.outputs.regular_suffixes }}
          SOURCE_SUFFIX: ${{ needs.prepare-image-build.outputs.source_suffix }}
        run: |
          set -euo pipefail

          while IFS= read -r image; do
            [ -n "$image" ] || continue

            args=()
            while IFS= read -r suffix; do
              [ -n "$suffix" ] || continue
              args+=("-t" "${image}:${suffix}")
            done <<< "$FINAL_SUFFIXES"

            docker buildx imagetools create \
              "${args[@]}" \
              "${image}:${SOURCE_SUFFIX}-amd64" \
              "${image}:${SOURCE_SUFFIX}-arm64"
          done <<< "$IMAGES"

      - name: Summarize image result
        shell: bash
        env:
          IMAGES: ${{ needs.prepare-image-build.outputs.images }}
        run: |
          echo "Published multi-arch images for:"
          printf '  - %s\n' "$IMAGES"

  summarize-image-build:
    name: Summarize local image build
    runs-on: ubuntu-24.04
    needs:
      - prepare-image-build
      - build-image-arch
    if: needs.prepare-image-build.outputs.push != 'true'

    permissions:
      contents: read

    steps:
      - name: Summarize image result
        shell: bash
        run: |
          echo "Built amd64 and arm64 release images in parallel without pushing."
          echo "Set REGISTRY_USER / REGISTRY_TOKEN and optionally DOCKERHUB_USER / DOCKERHUB_TOKEN to publish manifests."

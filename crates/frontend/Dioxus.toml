[application]
name = "pasion-frontend"
default_platform = "web"

[web.app]
title = "Pasion"

[web.watcher]
reload_html = true
watch_path = ["src", "assets"]

[server]
port = 8182

[[web.proxy]]
backend = "http://localhost:7080/api"

[[web.proxy]]
backend = "http://localhost:7080/upstream"

[[web.proxy]]
backend = "http://localhost:7080/authorize"

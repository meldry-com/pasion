[book]
title = "Palpo Authentication Service"
authors = ["Element Backend Team"]
language = "en"

src = "docs"

[build]
build-dir = "target/book"

[output.html]
# The URL visitors will be directed to when they try to edit a page
edit-url-template = "https://github.com/palpo-im/palpo-auth-service/edit/main/{path}"

# The source code URL of the repository
git-repository-url = "https://github.com/palpo-im/palpo-auth-service"

# The path that the docs are hosted on
site-url = "/palpo-auth-service/"
